<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A4472E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ArtisanConnect" />
  <meta name="application-name" content="Artisan Connect" />
  <meta name="description" content="AI-assisted marketplace connecting artisans with buyers." />

  <title>Artisan Connect — Where heritage finds its next chapter.</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/pwa-icon.svg" />
  <link rel="stylesheet" href="/src/logo.css" />
</head>
<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
  <script type="module" src="/src/pwa.js"></script>
  <script type="module" src="/src/landing-market-fix.js"></script>
  <script type="module" src="/src/demo-data.js"></script>
  <script type="module" src="/src/landing-products.js"></script>
  <script type="module" src="/src/craft-images.js"></script>
  <script type="module" src="/src/maker-source-images.js"></script>
  <script type="module" src="/src/seller-income.js"></script>
  <script type="module" src="/src/seller-market-sync.js"></script>
  <script type="module" src="/src/buyer-catalog-1.js"></script>
  <script type="module" src="/src/buyer-catalog-2.js"></script>
  <script type="module" src="/src/buyer-browse.js"></script>
  <script type="module" src="/src/buyer-suggestion-data.js"></script>
  <script type="module" src="/src/buyer-budget-only.js"></script>
  <script type="module" src="/src/demo-tour.js"></script>
  <script type="module" src="/src/landing-product-limit.js"></script>
  <script type="module" src="/src/mobile-responsive.js"></script>

  <script type="module">
    const lang=localStorage.getItem('ac-lang')||'en';
    if(lang!=='en'){
      Promise.all([
        import('/src/full-i18n.js'),
        import('/src/landing-extra-i18n.js'),
        import('/src/landing-final-fix.js')
      ]).catch(()=>{});
    }
    document.addEventListener('change',event=>{
      if(event.target.matches('select[aria-label="Language"]')){
        setTimeout(()=>location.reload(),30);
      }
    });
  </script>
</body>
</html>
